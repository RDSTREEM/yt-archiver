[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-archiver"
version = "0.1.0"
description = "An experimental video-based file archiver"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
yt-archiver = "yt_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]