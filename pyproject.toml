[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-archiver"
version = "0.1.0"
description = "An experimental video-based file archiver"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
video = ["numpy>=1.26", "opencv-python>=4.9"]
ui = ["streamlit>=1.40"]

[project.scripts]
yt-archiver = "yt_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]